name: Latest Writing

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://memex.keinmal.top/index.xml,https://docs.keinmal.top/index.xml"
          max_post_count: 6
          template: "- [$title]($url) <sub>$date</sub>"
          committer_username: github-actions
          committer_email: github-actions@github.com
